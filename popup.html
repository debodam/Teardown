<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Teardown</title>
  <style>
    body {
      width: 320px;
      min-height: 200px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 16px;
      background: #111;
      color: #eee;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 12px 0;
    }
    #status {
      font-size: 13px;
      color: #999;
    }
    button {
      margin-top: 12px;
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 6px;
      background: #4f46e5;
      color: white;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover {
      background: #4338ca;
    }
  </style>
</head>
<body>
  <h1>Teardown this product?</h1>
  <div id="status">Skeleton only — logic comes Saturday.</div>
  <button id="startBtn">Start Teardown</button>
  <script src="popup.js"></script>
</body>
</html>
